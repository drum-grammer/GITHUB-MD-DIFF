# pnpm 12는 설치할 때 빌드 스크립트를 돌릴지 이 파일에 묻는다 — 없으면 자리표시 파일을 만들어 작업 트리가 지저분해진다(release check가 멈춤).
# esbuild는 플랫폼 바이너리 패키지로 돌아가 설치 스크립트가 필요 없다
# packages: 저장소 루트(확장)와 packages/ 아래 로컬 리뷰 도구(engine·review — 아직 없음)다. 루트 줄이 없으면 pnpm 9는 어떤 명령도 돌리지 않았다.
# pnpm 버전은 package.json packageManager로 맞춘다 — pnpm 10 이상은 그 버전으로 알아서 바꿔 돈다
packages:
  - .
  - packages/*
allowBuilds:
  esbuild: false
