        <title id="explore-loop-title">공개 저장소 PR 탐험 순환</title>
        <desc id="explore-loop-desc">공개 저장소 128개의 마크다운 PR 300개를 고르고, 확장과 함께 열고, 결과를 요약하고, 원인을 찾아 고친 뒤 다시 도는 순환이며, 매 회차의 발견과 숫자는 가운데 기록에 쌓인다.</desc>
