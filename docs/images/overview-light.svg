<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="overview-light-title overview-light-desc">
  <title id="overview-light-title">How Markdown Diff Cat shows Markdown changes</title>
  <desc id="overview-light-desc">In a GitHub pull request the extension turns GitHub's rendered diff into a folded, commentable view, and renders the diff in the browser when GitHub times out. On your own machine the markdown-diff-cat command shows the same view for your working tree and hands your comments to a coding agent.</desc>
  <defs>
    <marker id="overview-light-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#5b6b8c"/></marker>
    <marker id="overview-light-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#f28a2e"/></marker>
  </defs>
